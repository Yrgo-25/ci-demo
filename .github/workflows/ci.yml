name: CI

# Specify when to run the pipeline.
on:
  push:
  pull_request:

# Specify jobs to run.
jobs:
  firmware-build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    needs: analyze-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build firmware
        run: ci/build.sh
      - name: Run firmware
        run: ./firmware
      - name: Collect artifacts in artifacts/
        run: |
          mkdir -p artifacts
          mv firmware artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts
          name: firmware
          if-no-files-found: error
          retention-days: 3

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: analyze-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Needed for the yrgo::test framework in libs/test.
          submodules: recursive
      - name: Build and run the test suite
        run: ci/unit_test.sh

  analyze-format:
    name: Check format with clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run analysis
        run: ci/format.sh --check
